<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1511" />
<meta name="description" content="Il portfolio di Gianmarco Antonacci: una casa dove ogni stanza è un progetto." />
<meta name="author" content="Gianmarco Antonacci" />
<title>Gianmarco Antonacci — La casa dei progetti</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Gianmarco Antonacci — La casa dei progetti" />
<meta property="og:description" content="Entra nella casa: ogni stanza è un progetto." />
<style>
:root {
  --ink: #16120e;
  --paper: #f6f1e8;
  --safe-top: max(16px, env(safe-area-inset-top));
  --safe-bottom: max(16px, env(safe-area-inset-bottom));
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #120e0a;
  color: var(--paper);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

canvas { display: block; }

button { border: 0; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid rgba(255, 214, 150, .5); outline-offset: 3px; }

.hidden { display: none !important; }

/* ---------- Entrance ---------- */

#entrance {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 28px;
  gap: 20px;
  background:
    radial-gradient(circle at 50% 42%, rgba(255, 206, 140, .20), transparent 55%),
    linear-gradient(180deg, #1b1510 0%, #110d09 100%);
  transition: opacity .9s ease;
}

#entrance.fading { opacity: 0; pointer-events: none; }

#entrance .eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(246, 241, 232, .55);
}

#entrance h1 {
  margin: 0;
  max-width: 14ch;
  font-size: clamp(42px, 7.5vw, 88px);
  line-height: .92;
  letter-spacing: -.04em;
  font-weight: 800;
}

#entrance p.lede {
  margin: 0;
  max-width: 44ch;
  color: rgba(246, 241, 232, .66);
  font-size: 15px;
  line-height: 1.6;
}

#enterButton {
  margin-top: 6px;
  min-height: 54px;
  padding: 0 30px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  transition: transform .25s ease;
}

#enterButton:hover { transform: translateY(-2px); }

.loading-note { margin: 0; font-size: 12px; color: rgba(246, 241, 232, .4); }

/* ---------- HUD ---------- */

#hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; }

#roomName {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-top) + 10px);
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 5px;
  text-align: center;
  opacity: 0;
  transition: opacity .5s ease;
}

#roomName.show { opacity: 1; }

#roomName small {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(246, 241, 232, .55);
}

#roomName strong {
  font-size: clamp(20px, 3.4vw, 30px);
  letter-spacing: -.03em;
  text-shadow: 0 4px 24px rgba(0, 0, 0, .6);
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 7px;
  height: 7px;
  margin: -3.5px 0 0 -3.5px;
  border-radius: 50%;
  background: rgba(246, 241, 232, .5);
  box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25);
  transition: transform .2s ease, background .2s ease;
}

#crosshair.active { transform: scale(2.1); background: rgba(255, 214, 150, .95); }

#prompt {
  position: absolute;
  left: 50%;
  top: calc(50% + 34px);
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(10, 8, 6, .72);
  border: 1px solid rgba(246, 241, 232, .16);
  backdrop-filter: blur(10px);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s ease;
}

#prompt.show { opacity: 1; }

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 6px);
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(246, 241, 232, .45);
}

#hint span {
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(10, 8, 6, .5);
  border: 1px solid rgba(246, 241, 232, .1);
}

/* ---------- Project panel ---------- */

#panel {
  position: fixed;
  z-index: 40;
  right: clamp(14px, 3vw, 40px);
  bottom: calc(var(--safe-bottom) + 8px);
  width: min(430px, calc(100vw - 28px));
  max-height: min(70dvh, 640px);
  overflow-y: auto;
  padding: 28px;
  border-radius: 26px;
  background: rgba(23, 18, 14, .9);
  border: 1px solid rgba(246, 241, 232, .14);
  backdrop-filter: blur(22px);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .6);
  transform: translateY(20px) scale(.98);
  opacity: 0;
  pointer-events: none;
  transition: transform .45s cubic-bezier(.16, 1, .3, 1), opacity .35s ease;
}

#panel.open { transform: none; opacity: 1; pointer-events: auto; }

#panelClose {
  position: absolute;
  right: 16px;
  top: 15px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(246, 241, 232, .1);
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
}

#panel .kicker {
  margin: 0 0 10px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent, #ffce8c);
}

#panel h2 {
  margin: 0;
  font-size: clamp(27px, 3.4vw, 38px);
  line-height: 1.02;
  letter-spacing: -.035em;
}

#panel .lede {
  margin: 16px 0 0;
  color: rgba(246, 241, 232, .72);
  font-size: 14px;
  line-height: 1.65;
}

#panel .facts { display: grid; gap: 8px; margin-top: 22px; }

#panel .facts span {
  padding: 13px 15px;
  border-radius: 14px;
  background: rgba(246, 241, 232, .06);
  border: 1px solid rgba(246, 241, 232, .09);
  font-size: 12px;
  line-height: 1.45;
  color: rgba(246, 241, 232, .82);
}

#panel .facts a { color: var(--accent, #ffce8c); }

@media (max-width: 720px) {
  #panel { right: 10px; left: 10px; width: auto; padding: 22px; max-height: 62dvh; }
  #hint span:nth-child(n+3) { display: none; }
}
</style>
</head>
<body>

<div id="entrance">
  <p class="eyebrow">Gianmarco Antonacci · Product designer</p>
  <h1>La casa dei progetti</h1>
  <p class="lede">Ogni stanza è un progetto. Entra, gira per le stanze e avvicinati a quello che ti incuriosisce.</p>
  <button id="enterButton" type="button">Entra nella casa</button>
  <p class="loading-note" id="loadingNote">Muoviti con W A S D o le frecce · guarda con il mouse</p>
</div>

<div id="hud" class="hidden">
  <div id="roomName"><small id="roomKicker"></small><strong id="roomTitle"></strong></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="hint">
    <span>W A S D muovi</span>
    <span>Mouse guarda</span>
    <span>E apri</span>
    <span>Esc chiudi</span>
  </div>
</div>

<div id="panel" aria-hidden="true">
  <button id="panelClose" type="button" aria-label="Chiudi">×</button>
  <p class="kicker" id="panelKicker"></p>
  <h2 id="panelTitle"></h2>
  <p class="lede" id="panelLede"></p>
  <div class="facts" id="panelFacts"></div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = sel => document.querySelector(sel);

  /* ============================================================
     ROOMS — the content of the house
     ============================================================ */

  const ROOMS = [
    {
      id: "bloop",
      name: "Bloop",
      kicker: "Event discovery · Product design",
      side: "left", z: -8,
      accent: "#9a7cff",
      wall: "#d9d0e6",
      lede: "Un'app per scoprire cosa succede davvero intorno a te. Il problema non era la mancanza di eventi, ma il rumore: Bloop filtra per affinità e vicinanza, e porta dalla curiosità all'RSVP in tre gesti.",
      facts: [
        "Scoperta per affinità, non per algoritmo cieco.",
        "Dalla curiosità all'RSVP in tre passaggi.",
        "Tono curioso, leggero, locale."
      ]
    },
    {
      id: "merkorn",
      name: "Merkorn",
      kicker: "B2B software · Product design",
      side: "right", z: -8,
      accent: "#ff9147",
      wall: "#ecd8c4",
      lede: "Software gestionale per chi lavora sul campo. L'obiettivo era togliere attrito: meno campi, meno passaggi, più chiarezza su cosa fare adesso.",
      facts: [
        "Flussi operativi ridotti all'essenziale.",
        "Dati complessi resi leggibili a colpo d'occhio.",
        "Affidabile, diretto, senza fronzoli."
      ]
    },
    {
      id: "dreambase",
      name: "Dreambase",
      kicker: "Wellness concept · Product design",
      side: "left", z: -22,
      accent: "#8f8cd8",
      wall: "#cdcde0",
      lede: "Un concept dedicato al sonno e al recupero. Tutto è costruito intorno a una sensazione di calma: ritmi lenti, bagliori morbidi, nessuna fretta.",
      facts: [
        "Toni notturni e bagliori morbidi.",
        "Animazioni sincronizzate con il respiro.",
        "Tecnologia percepita come atmosfera."
      ]
    },
    {
      id: "trainee",
      name: "TraineeUX",
      kicker: "App · Formazione UX gamificata",
      side: "right", z: -22,
      accent: "#6cbb95",
      wall: "#d2e1d6",
      lede: "Una palestra per designer: cinque livelli, dodici moduli. Ogni livello non aggiunge strumenti, allarga l'ambito su cui decidi. XP, serie e gradi trasformano lo studio in abitudine.",
      facts: [
        "Percorso «Dal mestiere al giudizio».",
        "XP, serie e gradi da Praticante a Expert.",
        "Mascotte-bolla con micro-espressioni."
      ]
    },
    {
      id: "foto",
      name: "Riccardo Orsini",
      kicker: "Brand identity · Sito fotografo",
      side: "left", z: -36,
      accent: "#e9e4da",
      wall: "#dedad3",
      lede: "Identità e sito per un fotografo di matrimonio, moda e ritratto. Bianco e nero come lingua madre, tipografia editoriale: la fotografia migliore non interrompe il momento, lo riconosce.",
      facts: [
        "Matrimonio, moda e ritratto · Italia e worldwide.",
        "Bianco e nero come scelta, non come filtro.",
        "Eleganza editoriale, contrasti puliti."
      ]
    },
    {
      id: "studio",
      name: "Lo studio",
      kicker: "Chi sono · Gianmarco Antonacci",
      side: "right", z: -36,
      accent: "#ffce8c",
      wall: "#e6d8c2",
      lede: "Sono Gianmarco, product designer. Do forma a prodotti digitali come fossero spazi: ogni progetto è una stanza con le sue regole, la sua luce e il suo carattere. Questa è la mia.",
      facts: [
        "UX/UI & product design",
        "Puglia · 41° N, 16° E",
        "<a href=\"mailto:giamma.antonacci@gmail.com\">giamma.antonacci@gmail.com</a> · <a href=\"tel:+393520295120\">352 029 5120</a>"
      ]
    }
  ];

  /* ============================================================
     HOUSE GEOMETRY
     ============================================================ */

  const H = 3.3;              // wall height
  const T = 0.3;              // wall thickness
  const HALL_HW = 2.7;        // hallway half width
  const DOOR_HW = 1.25;       // doorway half width
  const ROOM_W = 12;          // room depth, measured out from the hallway
  const ROOM_HD = 6;          // room half size along z
  const HALL_FRONT = 5;
  const HALL_BACK = -46;

  const colliders = [];

  function addCollider(cx, cz, w, d) {
    colliders.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2 });
  }

  let renderer, scene, camera;
  let floorMat, hallWallMat, ceilMat, trimMat, darkWoodMat, daylightMat;

  /* ---------- textures ---------- */

  function woodTexture() {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = "#8a6240";
    g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 8; i++) {
      const y = i * 64;
      const shade = 140 + Math.floor(Math.random() * 26) - 13;
      g.fillStyle = `rgb(${shade}, ${Math.floor(shade * .72)}, ${Math.floor(shade * .48)})`;
      g.fillRect(0, y, 512, 62);
      g.globalAlpha = .1;
      for (let k = 0; k < 34; k++) {
        g.strokeStyle = Math.random() > .5 ? "#3d2817" : "#c99a6e";
        g.lineWidth = Math.random() * 1.5;
        g.beginPath();
        const yy = y + Math.random() * 62;
        g.moveTo(0, yy);
        g.bezierCurveTo(170, yy + (Math.random() - .5) * 6, 340, yy + (Math.random() - .5) * 6, 512, yy);
        g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = "rgba(45,28,16,.45)";
      g.fillRect(0, y + 62, 512, 2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  function plasterTexture(hex) {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = hex;
    g.fillRect(0, 0, 256, 256);
    const img = g.getImageData(0, 0, 256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - .5) * 13;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  /* ---------- scene ---------- */

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color("#130f0b");
    scene.fog = new THREE.Fog("#130f0b", 16, 62);

    camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.08, 200);

    buildHouse();
    buildLights();

    window.addEventListener("resize", onResize);
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function addBox(x, y, z, w, h, d, mat, collide) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
    if (collide) addCollider(x, z, w, d);
    return m;
  }

  function buildHouse() {
    const wood = woodTexture();
    wood.repeat.set(8, 30);
    floorMat = new THREE.MeshStandardMaterial({ map: wood, roughness: .72, metalness: 0 });

    const plaster = plasterTexture("#e8dfd0");
    plaster.repeat.set(5, 2);
    hallWallMat = new THREE.MeshStandardMaterial({ map: plaster, roughness: .95, metalness: 0 });

    ceilMat = new THREE.MeshStandardMaterial({ color: "#efe8dc", roughness: 1, metalness: 0 });
    trimMat = new THREE.MeshStandardMaterial({ color: "#f7f2e8", roughness: .6, metalness: 0 });
    darkWoodMat = new THREE.MeshStandardMaterial({ color: "#4a3121", roughness: .55, metalness: 0 });
    daylightMat = new THREE.MeshStandardMaterial({
      color: "#ffffff", emissive: "#cfe4ff", emissiveIntensity: 3.2, roughness: 1
    });

    const hallLen = HALL_FRONT - HALL_BACK;
    const hallCz = (HALL_FRONT + HALL_BACK) / 2;

    const hallFloor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_HW * 2, hallLen), floorMat);
    hallFloor.rotation.x = -Math.PI / 2;
    hallFloor.position.set(0, 0, hallCz);
    hallFloor.receiveShadow = true;
    scene.add(hallFloor);

    const hallCeil = new THREE.Mesh(new THREE.PlaneGeometry(HALL_HW * 2, hallLen), ceilMat);
    hallCeil.rotation.x = Math.PI / 2;
    hallCeil.position.set(0, H, hallCz);
    scene.add(hallCeil);

    // hallway side walls, split around each doorway
    const doorZs = { left: [], right: [] };
    ROOMS.forEach(r => doorZs[r.side].push(r.z));

    ["left", "right"].forEach(side => {
      const sx = side === "left" ? -HALL_HW : HALL_HW;
      const zs = doorZs[side].slice().sort((a, b) => b - a);
      let cursor = HALL_FRONT;
      zs.forEach(dz => {
        segmentWall(sx, cursor, dz + DOOR_HW);
        addBox(sx, H - 0.45, dz, T, 0.9, DOOR_HW * 2, hallWallMat, false);
        cursor = dz - DOOR_HW;
      });
      segmentWall(sx, cursor, HALL_BACK);
    });

    function segmentWall(sx, zA, zB) {
      const len = Math.abs(zA - zB);
      if (len < 0.02) return;
      addBox(sx, H / 2, (zA + zB) / 2, T, H, len, hallWallMat, true);
    }

    addBox(0, H / 2, HALL_BACK, HALL_HW * 2 + T * 2, H, T, hallWallMat, true);
    addBox(0, H / 2, HALL_FRONT, HALL_HW * 2 + T * 2, H, T, hallWallMat, true);

    // skirting board along both hallway walls
    ["left", "right"].forEach(side => {
      const sx = (side === "left" ? -1 : 1) * (HALL_HW - T / 2 - 0.01);
      addBox(sx, 0.07, hallCz, 0.06, 0.15, hallLen, darkWoodMat, false);
    });

    // door frames around every opening
    ROOMS.forEach(r => {
      const sx = (r.side === "left" ? -1 : 1) * HALL_HW;
      addBox(sx, H / 2 - 0.3, r.z - DOOR_HW, T + 0.04, H - 0.6, 0.12, trimMat, false);
      addBox(sx, H / 2 - 0.3, r.z + DOOR_HW, T + 0.04, H - 0.6, 0.12, trimMat, false);
      addBox(sx, H - 0.92, r.z, T + 0.04, 0.12, DOOR_HW * 2 + 0.24, trimMat, false);
    });

    // window at the end of the hallway — the daylight you walk toward
    const win = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 1.9), daylightMat);
    win.position.set(0, 1.75, HALL_BACK + T / 2 + 0.02);
    scene.add(win);
    addBox(0, 1.75, HALL_BACK + T / 2 + 0.06, 3.4, 0.09, 0.09, trimMat, false);
    addBox(0, 1.75, HALL_BACK + T / 2 + 0.06, 0.09, 2.2, 0.09, trimMat, false);

    const sunShaft = new THREE.PointLight("#cfe4ff", 55, 26, 2);
    sunShaft.position.set(0, 1.9, HALL_BACK + 1.6);
    scene.add(sunShaft);

    // runner rug down the hallway
    const rug = new THREE.Mesh(
      new THREE.PlaneGeometry(2.6, hallLen - 6),
      new THREE.MeshStandardMaterial({ color: "#8d4f3a", roughness: 1 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.012, hallCz);
    rug.receiveShadow = true;
    scene.add(rug);

    ROOMS.forEach(buildRoom);
    ROOMS.forEach(dressRoom);
  }

  function buildRoom(room) {
    const dir = room.side === "left" ? -1 : 1;
    const innerX = dir * HALL_HW;
    const outerX = dir * (HALL_HW + ROOM_W);
    const cx = dir * (HALL_HW + ROOM_W / 2);
    room.center = new THREE.Vector3(cx, 0, room.z);

    const wood = floorMat.map.clone();
    wood.needsUpdate = true;
    wood.repeat.set(5, 5);
    const fm = new THREE.MeshStandardMaterial({ map: wood, roughness: .72 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_HD * 2), fm);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(cx, 0, room.z);
    floor.receiveShadow = true;
    scene.add(floor);

    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_HD * 2), ceilMat);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.set(cx, H, room.z);
    scene.add(ceil);

    const tex = plasterTexture(room.wall);
    tex.repeat.set(3, 1.5);
    const wm = new THREE.MeshStandardMaterial({ map: tex, roughness: .95 });
    room.wallMat = wm;

    addBox(outerX, H / 2, room.z, T, H, ROOM_HD * 2 + T, wm, true);
    addBox(cx, H / 2, room.z - ROOM_HD, ROOM_W, H, T, wm, true);
    addBox(cx, H / 2, room.z + ROOM_HD, ROOM_W, H, T, wm, true);

    const frontLen = ROOM_HD - DOOR_HW;
    if (frontLen > 0.02) {
      addBox(innerX, H / 2, room.z - DOOR_HW - frontLen / 2, T, H, frontLen, wm, true);
      addBox(innerX, H / 2, room.z + DOOR_HW + frontLen / 2, T, H, frontLen, wm, true);
    }
  }

  // Painted canvas used for the artwork hanging in each room
  function artTexture(room) {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 352;
    const g = c.getContext("2d");
    g.fillStyle = "#15110d";
    g.fillRect(0, 0, 512, 352);
    const grad = g.createLinearGradient(0, 0, 512, 352);
    grad.addColorStop(0, room.accent);
    grad.addColorStop(1, "#15110d");
    g.globalAlpha = .85;
    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 352);
    g.globalAlpha = 1;
    g.fillStyle = "rgba(255,255,255,.92)";
    g.font = "700 46px Inter, Helvetica, sans-serif";
    g.textBaseline = "top";
    g.fillText(room.name, 36, 220);
    g.font = "600 17px Inter, Helvetica, sans-serif";
    g.fillStyle = "rgba(255,255,255,.72)";
    g.fillText(room.kicker.toUpperCase(), 38, 284);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  function dressRoom(room) {
    const dir = room.side === "left" ? -1 : 1;
    const outerX = dir * (HALL_HW + ROOM_W);
    const cx = room.center.x;
    const inward = -dir;  // from the far wall back toward the hallway

    // ---- window on the far wall: cool daylight against the warm interior ----
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 3.4), daylightMat);
    win.rotation.y = dir * Math.PI / 2;
    win.position.set(outerX + inward * (T / 2 + 0.02), 1.75, room.z);
    scene.add(win);

    const frameX = outerX + inward * (T / 2 + 0.06);
    addBox(frameX, 1.75, room.z - 1.8, 0.09, 2.1, 0.1, trimMat, false);
    addBox(frameX, 1.75, room.z + 1.8, 0.09, 2.1, 0.1, trimMat, false);
    addBox(frameX, 2.8, room.z, 0.09, 0.1, 3.7, trimMat, false);
    addBox(frameX, 0.7, room.z, 0.09, 0.1, 3.7, trimMat, false);

    const day = new THREE.PointLight("#cfe4ff", 34, 16, 2);
    day.position.set(outerX + inward * 1.5, 2, room.z);
    scene.add(day);

    // ---- skirting all around ----
    addBox(outerX + inward * (T / 2 + 0.03), 0.07, room.z, 0.06, 0.15, ROOM_HD * 2, darkWoodMat, false);
    addBox(cx, 0.07, room.z - ROOM_HD + T / 2 + 0.03, ROOM_W, 0.15, 0.06, darkWoodMat, false);
    addBox(cx, 0.07, room.z + ROOM_HD - T / 2 - 0.03, ROOM_W, 0.15, 0.06, darkWoodMat, false);

    // ---- artwork: the project, hanging on the side wall ----
    const art = new THREE.Mesh(
      new THREE.PlaneGeometry(3.4, 2.34),
      new THREE.MeshStandardMaterial({ map: artTexture(room), roughness: .75 })
    );
    art.position.set(cx, 1.85, room.z - ROOM_HD + T / 2 + 0.07);
    scene.add(art);
    addBox(cx, 1.85, room.z - ROOM_HD + T / 2 + 0.03, 3.66, 2.6, 0.06, darkWoodMat, false);
    room.art = art;

    // picture light above the artwork
    const spot = new THREE.PointLight("#ffe9cc", 5, 5.5, 2);
    spot.position.set(cx, 2.95, room.z - ROOM_HD + 1.3);
    scene.add(spot);

    // ---- rug ----
    const rugColor = new THREE.Color(room.accent).lerp(new THREE.Color("#5b4433"), .55);
    const rug = new THREE.Mesh(
      new THREE.PlaneGeometry(6.4, 4.6),
      new THREE.MeshStandardMaterial({ color: rugColor, roughness: 1 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(cx, 0.012, room.z + 0.6);
    rug.receiveShadow = true;
    scene.add(rug);

    // ---- a low sideboard against the opposite wall ----
    const sbZ = room.z + ROOM_HD - T / 2 - 0.35;
    addBox(cx, 0.4, sbZ, 3.2, 0.8, 0.6, darkWoodMat, true);
    addBox(cx, 0.84, sbZ, 3.3, 0.06, 0.68, trimMat, false);

    // a small lamp on it, glowing in the project colour
    const lampShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.3, 0.34, 16),
      new THREE.MeshStandardMaterial({ color: "#fff1dc", emissive: room.accent, emissiveIntensity: .45, roughness: .9 })
    );
    lampShade.position.set(cx + 1.1, 1.12, sbZ);
    scene.add(lampShade);
    const lampLight = new THREE.PointLight(room.accent, 7, 5, 2);
    lampLight.position.set(cx + 1.1, 1.1, sbZ);
    scene.add(lampLight);
  }

  function buildLights() {
    scene.add(new THREE.AmbientLight("#ffe9cf", 0.28));
    scene.add(new THREE.HemisphereLight("#fff1dc", "#2b211a", 0.3));

    for (let i = 0; i < 4; i++) {
      const z = HALL_FRONT - 6 - i * 12;
      const l = new THREE.PointLight("#ffd3a0", 11, 17, 2);
      l.position.set(0, H - 0.75, z);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 12, 10),
        new THREE.MeshStandardMaterial({ color: "#fff6e6", emissive: "#ffd9ad", emissiveIntensity: 2.4 })
      );
      bulb.position.set(0, H - 0.72, z);
      scene.add(bulb);
      const cord = new THREE.Mesh(
        new THREE.CylinderGeometry(0.012, 0.012, 0.6, 6),
        new THREE.MeshStandardMaterial({ color: "#2d241c" })
      );
      cord.position.set(0, H - 0.36, z);
      scene.add(cord);
      scene.add(l);
    }

    ROOMS.forEach(room => {
      const l = new THREE.PointLight("#ffe2bb", 11, 18, 2);
      l.position.set(room.center.x, H - 0.5, room.z);
      l.castShadow = true;
      l.shadow.mapSize.set(512, 512);
      l.shadow.bias = -0.004;
      scene.add(l);
      room.light = l;
    });
  }

  /* ============================================================
     FIRST-PERSON CONTROLS
     ============================================================ */

  const player = {
    pos: new THREE.Vector3(0, 1.65, 2),
    yaw: 0,
    pitch: 0,
    radius: 0.42,
    speed: 4.2
  };

  const keys = Object.create(null);
  let pointerLocked = false;
  let started = false;

  function bindControls() {
    const el = renderer.domElement;

    el.addEventListener("click", () => {
      if (started && !pointerLocked && el.requestPointerLock) el.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      pointerLocked = document.pointerLockElement === el;
    });

    document.addEventListener("mousemove", e => {
      if (!pointerLocked) return;
      player.yaw -= e.movementX * 0.0022;
      player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - e.movementY * 0.0022));
    });

    let dragging = false, lx = 0, ly = 0;
    el.addEventListener("pointerdown", e => {
      if (pointerLocked) return;
      dragging = true; lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", e => {
      if (!dragging || pointerLocked) return;
      player.yaw -= (e.clientX - lx) * 0.005;
      player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - (e.clientY - ly) * 0.005));
      lx = e.clientX; ly = e.clientY;
    });

    window.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (e.code === "KeyE" || e.code === "Space") { e.preventDefault(); tryInteract(); }
      if (e.code === "Escape") closePanel();
    });
    window.addEventListener("keyup", e => { keys[e.code] = false; });
  }

  function movePlayer(dt) {
    let fwd = 0, strafe = 0;
    if (keys.KeyW || keys.ArrowUp) fwd += 1;
    if (keys.KeyS || keys.ArrowDown) fwd -= 1;
    if (keys.KeyA || keys.ArrowLeft) strafe -= 1;
    if (keys.KeyD || keys.ArrowRight) strafe += 1;
    if (!fwd && !strafe) return;

    const len = Math.hypot(fwd, strafe) || 1;
    fwd /= len; strafe /= len;

    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const dx = (-sin * fwd + cos * strafe) * player.speed * dt;
    const dz = (-cos * fwd + sin * strafe) * player.speed * dt;

    const r = player.radius;
    const nx = player.pos.x + dx;
    if (!hits(nx, player.pos.z, r)) player.pos.x = nx;
    const nz = player.pos.z + dz;
    if (!hits(player.pos.x, nz, r)) player.pos.z = nz;
  }

  function hits(x, z, r) {
    for (let i = 0; i < colliders.length; i++) {
      const c = colliders[i];
      if (x + r > c.minX && x - r < c.maxX && z + r > c.minZ && z - r < c.maxZ) return true;
    }
    return false;
  }

  /* ============================================================
     ROOM AWARENESS
     ============================================================ */

  let currentRoom = null;

  function roomAt(x, z) {
    for (const room of ROOMS) {
      const dir = room.side === "left" ? -1 : 1;
      const a = dir * HALL_HW, b = dir * (HALL_HW + ROOM_W);
      const minX = Math.min(a, b), maxX = Math.max(a, b);
      if (x > minX && x < maxX && z > room.z - ROOM_HD && z < room.z + ROOM_HD) return room;
    }
    return null;
  }

  function updateRoomState() {
    const inside = roomAt(player.pos.x, player.pos.z);

    if (inside !== currentRoom) {
      currentRoom = inside;
      const el = $("#roomName");
      if (inside) {
        $("#roomKicker").textContent = inside.kicker;
        $("#roomTitle").textContent = inside.name;
        el.classList.add("show");
      } else {
        el.classList.remove("show");
      }
    }

    const open = $("#panel").classList.contains("open");
    $("#prompt").classList.toggle("show", !!inside && !open);
    $("#crosshair").classList.toggle("active", !!inside && !open);
    if (inside && !open) $("#prompt").textContent = `E — apri «${inside.name}»`;
  }

  function tryInteract() {
    if (currentRoom) openPanel(currentRoom);
  }

  function openPanel(room) {
    const p = $("#panel");
    p.style.setProperty("--accent", room.accent);
    $("#panelKicker").textContent = room.kicker;
    $("#panelTitle").textContent = room.name;
    $("#panelLede").textContent = room.lede;
    $("#panelFacts").innerHTML = room.facts.map(f => `<span>${f}</span>`).join("");
    p.classList.add("open");
    p.setAttribute("aria-hidden", "false");
    if (document.exitPointerLock) document.exitPointerLock();
  }

  function closePanel() {
    const p = $("#panel");
    p.classList.remove("open");
    p.setAttribute("aria-hidden", "true");
  }

  /* ============================================================
     LOOP
     ============================================================ */

  let last = performance.now();

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (started) {
      movePlayer(dt);
      updateRoomState();
    }

    camera.position.copy(player.pos);
    camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  /* ============================================================
     BOOT
     ============================================================ */

  function boot() {
    if (!window.THREE) {
      $("#loadingNote").textContent = "Impossibile caricare la scena 3D.";
      return;
    }
    init();
    bindControls();
    requestAnimationFrame(tick);

    $("#enterButton").addEventListener("click", () => {
      started = true;
      $("#entrance").classList.add("fading");
      setTimeout(() => $("#entrance").classList.add("hidden"), 900);
      $("#hud").classList.remove("hidden");
      if (renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
    });

    $("#panelClose").addEventListener("click", closePanel);
  }

  boot();

  // test hooks
  window.__house = {
    ROOMS,
    player,
    roomAt,
    start() { started = true; $("#entrance").classList.add("hidden"); $("#hud").classList.remove("hidden"); },
    get colliderCount() { return colliders.length; }
  };
})();
</script>
</body>
</html>
