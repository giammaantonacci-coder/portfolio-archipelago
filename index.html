<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GA Studio — Gianmarco Antonacci, product designer</title>
<meta name="description" content="Studio di product design di Gianmarco Antonacci: app, siti web, brand identity e AI. Bloop, Merkorn, TraineeUX, Riccardo Orsini.">
<meta property="og:title" content="GA Studio — Gianmarco Antonacci, product designer">
<meta property="og:description" content="Idee. Schermate. Chiarezza. Prodotti che si capiscono.">
<meta property="og:image" content="img/bloop-home.webp">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232fe06d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=Manrope:wght@500;700;800&amp;family=Archivo:wght@500;800;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111;text-decoration:none}a:hover{color:#0a7a36}
.f-root{--ink:#111;--mute:#6b6b6b;--line:#e6e6e6;--soft:#f4f4f4;--card:#fafafa;--g:#2fe06d;background:#fff;color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;overflow-x:clip;font-size:15px}
.w{position:relative;max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.h{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.02}
.sub{margin:0;color:var(--mute);font-size:15px;line-height:1.55}
.lbl{margin:0;font-size:12px;font-weight:600;color:#0a7a36}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#111;color:#fff;font:600 14px 'Inter Tight',sans-serif;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.btn:hover{color:var(--g)}
.btn-l{background:#fff;color:#111;box-shadow:0 0 0 1px var(--line),0 4px 10px rgba(0,0,0,.05)}.btn-l:hover{color:#0a7a36}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.05);font-size:12px;font-weight:600}
.pill.dk{background:#111;color:#fff;box-shadow:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(47,224,109,.25)}
.card{position:relative;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.05);overflow:hidden}
.panel{border-radius:28px;background:linear-gradient(180deg,#f2f2f2,#fbfbfb);box-shadow:inset 0 0 0 1px var(--line)}

/* mockups */
.ip{position:relative;display:flow-root;border-radius:15.5%/7.2%;background:linear-gradient(150deg,#d8d8d6 0%,#9a9a97 35%,#c4c4c1 70%,#e6e6e4 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 24px 50px rgba(0,0,0,.18)}
.ip::before{content:"";position:absolute;left:-1.4%;top:19%;width:1.4%;height:11%;border-radius:2px 0 0 2px;background:#b3b3b0;box-shadow:0 160% 0 #b3b3b0}
.ip::after{content:"";position:absolute;right:-1.4%;top:26%;width:1.4%;height:15%;border-radius:0 2px 2px 0;background:#b3b3b0}
.ip .scr{position:relative;margin:3.4%;border-radius:12.6%/5.8%;overflow:hidden;background:#000}
.ip img{display:block;width:100%;aspect-ratio:1206/2622;object-fit:cover;object-position:top}
.ip .di{position:absolute;z-index:2;top:2.3%;left:50%;width:31%;aspect-ratio:3.7;margin-left:-15.5%;border-radius:999px;background:#000}
.bw{background:#fff;border:1px solid #d9d9d9;border-radius:14px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.12)}
.bw .bar{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-bottom:1px solid #e6e6e6;background:#f6f6f6}
.bw .bar i{width:8px;height:8px;background:#d4d4d4}.bw .bar i:first-child{background:var(--g)}
.bw .bar span{flex:1;margin:0 12%;height:14px;line-height:14px;text-align:center;background:#fff;border:1px solid #e6e6e6;font-size:9px;color:var(--mute)}
.bw img{display:block;width:100%;height:auto}

.tool{display:inline-flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(0,0,0,.06);flex-wrap:wrap;justify-content:center}
.tb{min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:600 13px 'Inter Tight',sans-serif;color:var(--mute);cursor:pointer}
.tb:hover{color:#111;background:var(--soft)}
.tb.on{background:#111;color:#fff}
.tgo{width:36px;height:36px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#111}

.sec{padding:clamp(72px,9vw,120px) 0}
.secg{background:var(--soft)}
.trust{display:flex;justify-content:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap;padding:22px 0;color:var(--mute);font-size:13px;font-weight:500}
.trust span{display:inline-flex;align-items:center;gap:8px}
.mt{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:transparent;font:600 12px 'Inter Tight',sans-serif;color:var(--mute);cursor:pointer}
.mt:hover{background:#fff;color:#111}
.mt.on{background:#fff;color:#111;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.06)}

.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.feat .card{display:flex;flex-direction:column;cursor:pointer;transition:transform .45s cubic-bezier(.16,1,.3,1);color:var(--ink)}
.feat .card:hover{transform:translateY(-4px);color:var(--ink)}
.feat .vis{position:relative;height:210px;margin:8px;border-radius:16px;background:linear-gradient(180deg,#ececec,#f7f7f7);overflow:hidden}
.feat .tx{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding:8px 22px 22px}
.go{flex:none;width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;transition:background .2s,color .2s}
.card:hover .go{background:var(--g);color:#111}

.works{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.wk{display:flex;flex-direction:column;cursor:pointer;color:var(--ink)}
.wk:hover{color:var(--ink)}
.wk .vis{position:relative;height:300px;margin:8px;border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding-top:30px;background:linear-gradient(180deg,#ececec,#f8f8f8)}
.wk .vis>div>*{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.wk:hover .vis>div>*{transform:translateY(-10px)}

.fl{display:flex;gap:14px}
.fl .ic{flex:none;width:36px;height:36px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}

/* contact form */
.chipb{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);font:600 13px 'Inter Tight',sans-serif;color:var(--ink);cursor:pointer}
.chipb:hover{box-shadow:0 0 0 1px #111}
.chipb.on{background:#111;color:#fff;box-shadow:none}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mute)}
.fld input,.fld textarea{font:inherit;font-size:15px;font-weight:400;color:var(--ink);padding:12px 14px;border-radius:12px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line)}
.fld input:focus,.fld textarea:focus{outline:none;box-shadow:0 0 0 1.5px #111}

/* service pages */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.steps.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.steps>div{padding:20px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.ticks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.ticks li{display:flex;gap:10px;font-size:14px;line-height:1.45;color:#444}
.ticks li::before{content:"";flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--g)}
.proj{padding:clamp(40px,5vw,64px) 0;border-top:1px solid var(--line)}
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,2.4vw,32px);padding:clamp(28px,4vw,48px);border-radius:24px;background:linear-gradient(180deg,#efefef,#f9f9f9)}
.gal figure{margin:0;display:flex;flex-direction:column;gap:10px}

/* brand boards */
.bb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.bc{border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.bc .k{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.sw{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px;border-radius:12px;min-height:64px;font-size:12px;font-weight:600}

[data-par]{will-change:transform;backface-visibility:hidden}
@media (prefers-reduced-motion:reduce){[data-par]{transform:none !important;will-change:auto}}
@media (max-width:860px){.links{display:none !important}.feat,.two{grid-template-columns:minmax(0,1fr) !important}.works{grid-template-columns:minmax(0,1fr)}.works>*{grid-column:auto !important}.foot{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.steps,.steps.six{grid-template-columns:minmax(0,1fr)}.ticks{grid-template-columns:minmax(0,1fr)}.bb{grid-template-columns:minmax(0,1fr)}.bb>*{grid-column:auto !important;grid-row:auto !important}}
</style>
</head>
<body>
<template id="tpl">

<div class="f-root">

  <!-- NAV + HERO -->
  <section style="padding: 14px">
    <div class="panel" style="position: relative; overflow: hidden">
      <div class="w" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 20px; padding-bottom: 20px">
        <a href="#top" onClick="{{goHome}}" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.03em"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: #111; color: #2fe06d; display: grid; place-items: center; font-size: 10px; font-weight: 700">GA</span>GA Studio</a>
        <nav class="links" aria-label="Pagine" style="display: flex; gap: 20px; font-size: 13px; font-weight: 500; color: #6b6b6b">
          <sc-for list="{{navSvc}}" as="v" hint-placeholder-count="4"><a href="#top" onClick="{{v.go}}" style="{{v.style}}">{{v.label}}</a></sc-for>
          <a href="#lavori" onClick="{{goWork}}">Lavori</a>
          <a href="#contatti">Contatti</a>
        </nav>
        <a class="btn" href="#contatti" style="min-height: 38px; font-size: 13px">Prenota una call</a>
      </div>

      <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
        <div id="top" class="w" style="text-align: center; padding-top: clamp(32px, 5vw, 56px)">
          <span class="pill"><span class="dot" aria-hidden="true"></span>Disponibile per nuovi progetti</span>
          <h1 class="h" style="margin: 22px auto 0; max-width: 16ch; font-size: clamp(40px, 6vw, 72px)">Idee. Schermate. Chiarezza.<br><span style="color: #8a8a8a">Prodotti che si capiscono.</span></h1>
          <p class="sub" style="margin: 18px auto 0; max-width: 46ch; font-size: 16px">Uno studio di product design per app, siti web e brand, con foto, video e processi potenziati dall'AI. Un solo referente, dall'idea al lancio.</p>
          <div style="margin-top: 28px">
            <div class="tool" role="group" aria-label="Cosa ti serve?">
              <sc-for list="{{needs}}" as="n" hint-placeholder-count="4"><button type="button" class="{{n.cls}}" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></sc-for>
              <a class="tgo" href="#top" onClick="{{cur.go}}" aria-label="Apri il servizio"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></a>
            </div>
          </div>
          <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px">
            <a class="btn" href="#top" onClick="{{cur.go}}">{{cur.cta}}</a>
            <a class="btn btn-l" href="#lavori">Guarda i lavori ›</a>
          </div>
        </div>

        <div aria-live="polite" style="position: relative; height: clamp(320px, 38vw, 460px); margin-top: clamp(36px, 5vw, 56px); overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent)">
          <div data-par="0.08" style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; gap: 22px">
            <sc-if value="{{cur.isApp}}" hint-placeholder-val="{{ true }}">
              <div class="ip" style="width: 200px; margin-top: 70px; transform: rotate(-6deg)"><div class="scr"><img src="img/bloop-home.webp" alt="App Bloop"><span class="di"></span></div></div>
              <div class="ip" style="width: 220px; margin-top: 20px"><div class="scr"><img src="img/trainee-home.webp" alt="App TraineeUX"><span class="di"></span></div></div>
              <div class="ip" style="width: 200px; margin-top: 70px; transform: rotate(6deg)"><div class="scr"><img src="img/bloop-results.webp" alt="App Bloop, risultati"><span class="di"></span></div></div>
            </sc-if>
            <sc-if value="{{cur.isWeb}}" hint-placeholder-val="{{ false }}">
              <div class="bw" style="width: min(820px, 86%); margin-top: 20px"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>orsiniphoto.it</span></div><img src="img/orsini-home.webp" alt="Sito di Riccardo Orsini"></div>
            </sc-if>
            <sc-if value="{{cur.isBrand}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 16px; margin-top: 40px; flex-wrap: wrap; justify-content: center">
                <div class="card" style="width: 200px; height: 200px; display: grid; place-items: center; background: #9747ff"><span aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, 18px); grid-template-rows: repeat(3, 18px)"><i style="grid-column: 3; grid-row: 1; background: #fff; border-radius: 3px"></i><i style="grid-column: 2; grid-row: 2; background: #fff; border-radius: 3px"></i><i style="grid-column: 4; grid-row: 2; background: #fff; border-radius: 3px"></i><i style="grid-column: 1; grid-row: 3; background: #fff; border-radius: 3px"></i><i style="grid-column: 5; grid-row: 3; background: #fff; border-radius: 3px"></i></span></div>
                <div class="card" style="width: 200px; height: 200px; display: grid; place-items: center; background: #000"><span aria-hidden="true" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 106px; line-height: .8; letter-spacing: -.04em"><span style="color: #ff6a2b">o</span><span style="color: #9a7cff">o</span></span></div>
                <div class="card" style="width: 200px; height: 200px; display: grid; place-items: center; background: #f2fbf6"><img src="img/trainee-icon.webp" alt="Logo TraineeUX" style="display: block; width: 130px; height: auto"></div>
                <div class="card" style="width: 200px; height: 200px; display: grid; place-items: center; background: #fff"><span style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="position: relative; display: inline-block; width: 34px; height: 54px"><i style="position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #111; box-sizing: border-box"></i><i style="position: absolute; left: 1px; top: 38px; width: 36px; height: 2px; background: #111; transform-origin: 0 0; transform: rotate(32deg)"></i></span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 12px; letter-spacing: .16em">RICCARDO ORSINI</b><span style="font-size: 9px; letter-spacing: .3em; color: #6b6b6b">PHOTOGRAPHER</span></span></span></div>
              </div>
            </sc-if>
            <sc-if value="{{cur.isAi}}" hint-placeholder-val="{{ false }}">
              <div style="position: relative; width: 420px; height: 420px; margin-top: 10px">
                <div style="position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px #dcdcdc"></div>
                <div style="position: absolute; inset: 70px; border-radius: 50%; box-shadow: inset 0 0 0 1px #dcdcdc"></div>
                <div style="position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: #111; color: #2fe06d; display: grid; place-items: center; font-weight: 700; font-size: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.25)">AI</div>
                <span class="pill dk" style="position: absolute; left: 6%; top: 24%">Foto</span>
                <span class="pill dk" style="position: absolute; right: 2%; top: 38%">Video</span>
                <span class="pill" style="position: absolute; left: 22%; bottom: 20%">Processi automatici</span>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isSvc}}" hint-placeholder-val="{{ false }}">
        <div id="top" class="w" style="padding-top: clamp(24px, 4vw, 48px); padding-bottom: clamp(40px, 6vw, 72px)">
          <button type="button" class="btn btn-l" onClick="{{goHome}}" style="min-height: 36px; font-size: 13px">← Home</button>
          <div class="two" style="display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(24px, 4vw, 56px); align-items: end; margin-top: clamp(28px, 4vw, 48px)">
            <div>
              <span class="pill"><span class="dot" aria-hidden="true"></span>Servizio {{sv.n}} di 4</span>
              <h1 class="h" style="margin-top: 18px; font-size: clamp(44px, 6.4vw, 80px)">{{sv.title}}</h1>
              <p class="sub" style="margin-top: 16px; max-width: 48ch; font-size: 17px">{{sv.lead}}</p>
            </div>
            <div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
              <p class="lbl">Ideale per</p><p style="margin: 0; font-size: 14px; line-height: 1.5">{{sv.for}}</p>
              <a class="btn" href="#contatti" style="margin-top: 6px">Raccontaci il progetto</a>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </section>

  <div class="w">
    <div class="trust">
      <span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M5.5 8.2l1.7 1.7 3.3-3.6"></path></svg>Prima call gratuita</span>
      <span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 2l5 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V4z"></path></svg>Tempi decisi insieme a te</span>
      <span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"></circle><path d="M3 14c.6-2.8 2.6-4 5-4s4.4 1.2 5 4"></path></svg>Un solo referente</span>
      <span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h3l2-4 2 8 2-4h3"></path></svg>Aggiornamenti ogni settimana</span>
    </div>
  </div>

  <!-- ===================== HOME ===================== -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">

    <section id="metodo" class="sec">
      <div class="w">
        <div class="two" style="display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: 24px; align-items: end; margin-bottom: 36px">
          <h2 class="h" style="font-size: clamp(30px, 3.6vw, 44px)">Un metodo che lavora<br>come pensano le persone.</h2>
          <p class="sub">Cinque passi, uguali per un'app, un sito o un brand. Al centro c'è sempre la UX: le decisioni si prendono guardando chi userà il prodotto.</p>
        </div>
        <div class="panel" style="padding: clamp(16px, 2.4vw, 28px)">
          <div class="card" style="max-width: 900px; margin: 0 auto">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid #e6e6e6; background: #f3f3f3">
              <div role="group" aria-label="Passi del metodo" style="display: flex; gap: 4px; flex-wrap: wrap">
                <sc-for list="{{steps}}" as="s" hint-placeholder-count="5"><button type="button" class="{{s.cls}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}">{{s.n}} {{s.short}}</button></sc-for>
              </div>
              <span style="display: flex; gap: 6px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #111"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #2fe06d"></span></span>
            </div>
            <div aria-live="polite" style="padding: clamp(22px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px; min-height: 260px; background: #fff">
              <p class="lbl">Passo {{st.n}} di 5 · {{st.when}}</p>
              <h3 class="h" style="font-size: clamp(24px, 2.6vw, 32px)">{{st.title}}</h3>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #444; max-width: 62ch">{{st.text}}</p>

class Component extends DCLogic {
  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    // Parallax only on a few showcase visuals. Read every position first, then write, once per frame.
    this.onScroll = () => {
      if (this.raf || this.reduce) return;
      this.raf = requestAnimationFrame(() => {
        this.raf = 0;
        const h = window.innerHeight || 800;
        const k = (window.innerWidth || 1200) < 700 ? 0.5 : 1;
        const els = document.querySelectorAll("[data-par]");
        const ys = [];
        els.forEach(el => {
          const r = (el.parentElement || el).getBoundingClientRect();
          if (r.bottom < -100 || r.top > h + 100) { ys.push(null); return; }
          const f = (parseFloat(el.getAttribute("data-par")) || 0) * k;
          ys.push(Math.max(-48, Math.min(48, (r.top + r.height / 2 - h / 2) * -f)));
        });
        els.forEach((el, i) => {
          if (ys[i] === null) return;
          const t = "translate3d(0," + ys[i].toFixed(1) + "px,0)";
          if (el.style.transform !== t) el.style.transform = t;
        });
      });
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    window.addEventListener("resize", this.onScroll);
    this.onScroll();
  }
  componentDidUpdate() { if (this.onScroll) this.onScroll(); }
  componentWillUnmount() {
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("resize", this.onScroll);
    cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const page = this.state.page || "home";
    const need = this.state.need || "app";
    const step = this.state.step ?? 0;
    const types = this.state.types || {};
    const go = (p, anchor) => e => {
      if (e && e.preventDefault) e.preventDefault();
      this.setState({ page: p }, () => {
        const el = anchor && document.getElementById(anchor);
        if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" });
        else if (window.scrollTo) window.scrollTo(0, 0);
      });
    };
    const svcKey = page.startsWith("svc:") ? page.slice(4) : null;
    const S = svcKey ? SERVICES[svcKey] : null;
    const n = NEEDS.find(x => x.id === need);
    const st = STEPS[step];
    const shot = (app, [src, cap], name) => ({
      isApp: app, isWeb: !app, src, cap, alt: name + ", " + cap.toLowerCase(),
      box: app ? "flex: 0 1 220px; min-width: 0" : "flex: 1 1 100%; max-width: 900px"
    });
    return {
      isHome: page === "home",
      isSvc: !!S,
      goHome: go("home"),
      goWork: go("home", "lavori"),
      goApp: go("svc:app"), goWeb: go("svc:web"), goBrand: go("svc:brand"), goAi: go("svc:ai"),
      navSvc: Object.keys(SERVICES).map(k => ({ label: SERVICES[k].label, go: go("svc:" + k), style: svcKey === k ? "color: #111; font-weight: 600" : "" })),

      needs: NEEDS.map(x => ({ label: x.label, cls: x.id === need ? "tb on" : "tb", pressed: x.id === need ? "true" : "false", pick: () => this.setState({ need: x.id }) })),
      cur: { ...n, isApp: n.kind === "app", isWeb: n.kind === "web", isBrand: n.kind === "brand", isAi: n.kind === "ai", go: go("svc:" + n.id) },

      steps: STEPS.map((x, i) => ({ n: x.n, short: x.short, cls: i === step ? "mt on" : "mt", pressed: i === step ? "true" : "false", pick: () => this.setState({ step: i }) })),
      st: { ...st, n: step + 1, bar: "width: " + ((step + 1) * 20) + "%", btn: step < 4 ? "Passo successivo →" : "Ricomincia" },
      nextStep: () => this.setState({ step: (step + 1) % 5 }),

      works: WORKS.map(k => ({ ...k, isApp: !!k.app, isWeb: !k.app, span: "grid-column: span " + k.span, box: k.app ? "width: 170px" : "width: 88%", go: go("svc:" + k.svc, k.anchor) })),

      sv: S ? {
        ...S,
        isBrand: svcKey === "brand", isAi: svcKey === "ai", hasShots: !!S.projects,
        stepsCls: S.flow.length > 4 ? "steps six" : "steps",
        flow: S.flow.map(([t, d], i) => ({ n: String(i + 1).padStart(2, "0"), t, d })),
        projects: (S.projects || []).map(([id, name, kind, desc, shots, app, url]) => ({ id, name, kind, desc, url, shots: shots.map(s => shot(app, s, name)) }))
      } : { flow: [], projects: [], gets: [] },

      brands: BRANDS.map(b => ({
        ...b,
        isMerkorn: b.id === "merkorn", isBloop: b.id === "bloop", isTrainee: b.id === "trainee", isOrsini: b.id === "orsini",
        colors: b.colors.map(([name, hex, bg, fg]) => ({ name, hex, style: "background: " + bg + "; color: " + fg + "; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08)" }))
      })),
      pixels: PIXELS,
      moods: MOODS,

      others: Object.keys(SERVICES).filter(k => k !== svcKey).map(k => ({ label: SERVICES[k].title, go: go("svc:" + k) })),
      types: TYPES.map((label, i) => ({ label, cls: types[i] ? "chipb on" : "chipb", pressed: types[i] ? "true" : "false", toggle: () => this.setState({ types: { ...types, [i]: !types[i] } }) }))
    };
  }
}

dcMount(Component);

document.addEventListener("click", function (e) {
  var btn = e.target.closest && e.target.closest("#send");
  if (!btn) return;
  var f = btn.closest("form");
  if (!f) return;
  e.preventDefault();
  var v = function (n) { var el = f.querySelector("[name=" + n + "]"); return el ? el.value.trim() : ""; };
  var types = Array.prototype.map.call(f.querySelectorAll('button[aria-pressed="true"]'), function (b) { return b.textContent.trim(); });
  var lines = [];
  if (types.length) lines.push("Mi serve: " + types.join(", "));
  if (v("nome")) lines.push("Nome: " + v("nome"));
  if (v("email")) lines.push("Email: " + v("email"));
  if (v("azienda")) lines.push("Azienda o progetto: " + v("azienda"));
  if (v("messaggio")) lines.push("", v("messaggio"));
  location.href = "mailto:giamma.antonacci@gmail.com?subject=" + encodeURIComponent("Nuovo progetto" + (v("nome") ? " — " + v("nome") : "")) + "&body=" + encodeURIComponent(lines.join("\n"));
});
