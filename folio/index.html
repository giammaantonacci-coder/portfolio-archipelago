<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gianmarco Antonacci — Product designer</title>
<meta name="description" content="Gianmarco Antonacci, product designer. Selected work: Bloop, Merkorn, Dreambase, TraineeUX, Riccardo Orsini.">
<meta property="og:title" content="Gianmarco Antonacci — Product designer">
<meta property="og:description" content="Digital products designed with the rigor of a manifesto.">
<meta property="og:image" content="img/bloop-home.webp">
<meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e2231a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f4ef;--ink:#0e0e0e;--muted:#6a675f;--red:#e2231a;--rule:#e9e6df}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;overflow-x:hidden}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.wrap{position:relative;max-width:1200px;margin:0 auto;padding:0 40px}
.grid12{position:absolute;inset:0 40px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px;pointer-events:none}
.grid12 span{border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.lay{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.red{color:var(--red)}
.hero{margin:0;font-weight:800}.hero:focus{outline:none}
.dot{border-radius:50%;background:var(--red)}
.proj{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-top:2px solid var(--ink);cursor:pointer}
.proj .pn{font-size:clamp(30px,3.6vw,48px);font-weight:700;letter-spacing:-.04em;transition:color .2s,transform .35s cubic-bezier(.16,1,.3,1)}
.proj:hover .pn,.proj:focus-visible .pn,.proj.on .pn{color:var(--red);transform:translateX(10px)}
.lnk{min-height:44px;padding:0;border:0;background:none;color:var(--ink);font:500 12px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.lnk:hover{color:var(--red)}
.big{font-family:'Inter Tight',system-ui,sans-serif;font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:-.045em;text-transform:none;text-align:left;line-height:1.05}
.phone{position:relative;width:100%;max-width:260px;padding:8px;border-radius:42px;background:var(--ink);box-shadow:0 24px 50px rgba(14,14,14,.18)}
.phone .scr{aspect-ratio:169/365;border-radius:34px;overflow:hidden;background:#000}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.phone .isl{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:58px;height:16px;border-radius:9px;background:#000}
.win{width:100%;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.win .bar{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-bottom:2px solid var(--ink);background:#fff}
.win .bar i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.win .bar i:first-child{background:var(--red);border-color:var(--red)}
.win .bar span{margin-left:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win img{display:block;width:100%;height:auto}
.prev{position:sticky;top:32px;display:flex;flex-direction:column;gap:18px}
.prev .phone{max-width:220px}
.lede{margin:0;font-size:clamp(22px,2.4vw,32px);line-height:1.22;font-weight:500;letter-spacing:-.025em}
.fig{margin:0;display:flex;flex-direction:column;gap:14px}
.fig.ph{align-items:center}
.fig figcaption{line-height:1.5}
.fig.ph figcaption{text-align:center;max-width:26ch}
.view{animation:in .5s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.proj .pn{transition:none}}
@media (max-width:820px){
  .wrap{padding:0 20px}.grid12{display:none}
  .lay{grid-template-columns:minmax(0,1fr);row-gap:10px}
  .lay>*{grid-column:auto !important;grid-row:auto !important;justify-self:start !important}
  .hero{font-size:22vw !important}.dot{display:none}
  .prev{position:static}.prev .hint{display:none}
  .navrow{display:flex;justify-content:space-between}
  .shots{grid-template-columns:repeat(2,minmax(0,1fr)) !important;column-gap:14px}
  .shots>.ph{grid-column:span 1 !important}
  .shots>.dk{grid-column:1 / -1 !important}
  .phone{border-radius:30px;padding:6px}.phone .scr{border-radius:25px}.phone .isl{top:12px;width:40px;height:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid12" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <header class="lay" style="padding:26px 0 0">
    <a class="mono" href="#" data-home style="grid-column:1 / span 4;color:var(--ink)">Gianmarco Antonacci</a>
    <span class="mono" style="grid-column:5 / span 4">Product designer</span>
    <a class="mono" href="mailto:giamma.antonacci@gmail.com" style="grid-column:9 / span 4;justify-self:end;color:var(--ink)">Contact ↗</a>
  </header>

  <main id="app"></main>

  <footer class="lay" style="padding:140px 0 40px;align-items:end">
    <a href="mailto:giamma.antonacci@gmail.com" style="grid-column:1 / span 8;font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:-.045em;line-height:1">giamma.antonacci<br>@gmail.com</a>
    <a class="mono" href="tel:+393520295120" style="grid-column:10 / span 3;justify-self:end;color:var(--ink)">+39 352 029 5120</a>
  </footer>
</div>

<script>
const PROJECTS = [
  { id: "bloop", n: "01", name: "Bloop", short: "Event discovery", kicker: "Event discovery · App",
    desc: "Discover what's happening around you: from curiosity to RSVP in three taps.",
    shots: [
      ["bloop-home", "Home with recommended events"],
      ["bloop-search", "Search with suggestions"],
      ["bloop-results", "Results near you"]
    ] },
  { id: "merkorn", n: "02", name: "Merkorn", short: "Software house", kicker: "Software house · Website", device: "desktop", url: "merkorn.com",
    desc: "The website of a software house from Apulia that builds custom management software for small and medium businesses: putting data in order, to decide sooner.",
    shots: [
      ["merkorn-home", "Home: custom management software for SMEs"],
      ["merkorn-clients", "Who we work for: manufacturing, distribution, services"],
      ["merkorn-services", "Services: tailored software for every department"]
    ] },
  { id: "dreambase", n: "03", name: "Dreambase", short: "Physical product + app", kicker: "Physical product + app · Sleep",
    desc: "A sleep device that works with light and sound, guided by an app: pairing in a few steps, tailored programs and a summary of every night.",
    shots: [
      ["dreambase-home", "Home with device status and sleep summary"],
      ["dreambase-quick", "Quick programs"],
      ["dreambase-velo", "Detail of the “Velo di Sogno” program"],
      ["dreambase-custom", "A freshly created custom program"]
    ] },
  { id: "traineeux", n: "04", name: "TraineeUX", short: "UX training", kicker: "App · Gamified UX training",
    desc: "An app to train your judgment as a designer: a levelled path, timed exercises, XP and streaks, industry news and a leaderboard with friends.",
    shots: [
      ["trainee-home", "Home with rank, XP and the exercise to resume"],
      ["trainee-path", "The “From craft to judgment” path and its modules"],
      ["trainee-news", "Industry news, aggregated in real time"],
      ["trainee-friends", "Friends: invites and leaderboard"]
    ] },
  { id: "riccardo-orsini", n: "05", name: "Riccardo Orsini", short: "Brand identity", kicker: "Brand identity · Photographer website", device: "desktop", url: "riccardo-orsini-photography",
    desc: "Identity and website for a wedding, fashion and portrait photographer: editorial typography and black and white, so the pictures do the talking.",
    shots: [
      ["orsini-home", "Home: “Images that stay with you.”"],
      ["orsini-manifesto", "Manifesto: “Presence, not pose.”"],
      ["orsini-work", "Work: weddings, brand & fashion, people"]
    ] }
];

const app = document.getElementById("app");
const img = k => "img/" + k + ".webp";
const isDesk = p => p.device === "desktop";
let hover = null;

function device(p, [key, cap], eager) {
  const alt = p.name + ", " + cap.charAt(0).toLowerCase() + cap.slice(1);
  const load = eager ? "" : ' loading="lazy"';
  return isDesk(p)
    ? `<div class="win"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>${p.url}</span></div><img src="${img(key)}" alt="${alt}"${load}></div>`
    : `<div class="phone"><div class="scr"><img src="${img(key)}" alt="${alt}"${load}></div><span class="isl" aria-hidden="true"></span></div>`;
}

function preview() {
  const p = PROJECTS.find(x => x.id === hover);
  if (!p) return `
    <p class="lede">I design digital products with the rigor of a manifesto: every element has a reason to be where it is.</p>
    <p class="mono hint" style="margin:0">Hover a project, click to open it →</p>`;
  return `
    ${device(p, p.shots[0], true)}
    <p class="mono red" style="margin:0">${p.n} — ${p.kicker}</p>
    <p style="margin:0;font-size:18px;line-height:1.45;max-width:40ch">${p.desc}</p>
    <p class="mono" style="margin:0">Click to open the project →</p>`;
}

function listView() {
  return `<div class="view">
    <section class="lay" style="padding-top:72px;align-items:start">
      <h1 class="hero" style="grid-column:1 / span 12;font-size:clamp(120px,21vw,290px);line-height:.78;letter-spacing:-.07em">Gian<br>marco</h1>
      <div class="dot" aria-hidden="true" style="grid-column:10 / span 3;grid-row:1;justify-self:end;align-self:end;width:clamp(120px,17vw,220px);aspect-ratio:1;margin-bottom:4%"></div>
    </section>
    <div class="lay" aria-hidden="true" style="padding:18px 0 0">
      <span class="mono" style="grid-column:1 / span 3">↕ cap height 0.78</span>
      <span class="mono" style="grid-column:4 / span 3">tracking −70</span>
      <span class="mono" style="grid-column:7 / span 3">grid 12 · gutter 20</span>
      <span class="mono" style="grid-column:10 / span 3;justify-self:end">41° N 16° E</span>
    </div>
    <section class="lay" style="padding:120px 0 0;row-gap:40px;align-items:start">
      <div style="grid-column:1 / span 5;align-self:stretch">
        <div class="prev" id="prev" aria-live="polite">${preview()}</div>
      </div>
      <nav aria-label="Projects" style="grid-column:7 / span 6;display:flex;flex-direction:column;border-bottom:2px solid var(--ink)">
        ${PROJECTS.map(p => `
          <a class="proj${p.id === hover ? " on" : ""}" href="#/${p.id}" data-id="${p.id}">
            <span class="mono red">${p.n} — ${p.short}</span>
            <span class="pn">${p.name}</span>
          </a>`).join("")}
      </nav>
    </section>
  </div>`;
}

function projectView(p) {
  const nxt = PROJECTS[(PROJECTS.indexOf(p) + 1) % PROJECTS.length];
  const span = p.shots.length >= 4 ? 3 : 4;
  const shots = p.shots.map((s, i) => {
    const cap = `<figcaption class="mono"><span class="red">${String(i + 1).padStart(2, "0")} —</span> ${s[1]}</figcaption>`;
    return isDesk(p)
      ? `<figure class="fig dk" style="grid-column:1 / span 12">${device(p, s, i === 0)}${cap}</figure>`
      : `<figure class="fig ph" style="grid-column:span ${span}">${device(p, s, i < 2)}${cap}</figure>`;
  }).join("");
  return `<article class="view" aria-labelledby="pt" style="padding-top:48px">
    <div class="lay navrow">
      <a class="lnk" href="#" data-home style="grid-column:1 / span 6;justify-self:start;display:flex;align-items:center">← Index</a>
      <a class="lnk" href="#/${nxt.id}" style="grid-column:7 / span 6;justify-self:end;display:flex;align-items:center">${nxt.name} →</a>
    </div>
    <div class="lay" style="padding-top:64px;align-items:end">
      <h1 class="hero" id="pt" tabindex="-1" style="grid-column:1 / span 10;font-size:clamp(80px,13vw,190px);line-height:.82;letter-spacing:-.065em">${p.name}</h1>
      <div class="dot" aria-hidden="true" style="grid-column:11 / span 2;justify-self:end;width:clamp(90px,10vw,140px);aspect-ratio:1;display:grid;place-items:center;color:#fff;font:500 clamp(22px,2.6vw,34px) 'JetBrains Mono',monospace">${p.n}</div>
    </div>
    <div class="lay" style="padding:18px 0 0">
      <span class="mono" style="grid-column:1 / span 3">Project ${p.n} / 05</span>
      <span class="mono" style="grid-column:4 / span 4">${p.kicker}</span>
      <span class="mono" style="grid-column:8 / span 2">${isDesk(p) ? "Desktop · browser" : "Mobile · iPhone"}</span>
      <span class="mono" style="grid-column:10 / span 3;justify-self:end">${p.shots.length} screens</span>
    </div>
    <div class="lay" style="padding-top:72px">
      <p class="lede" style="grid-column:1 / span 6;line-height:1.25">${p.desc}</p>
    </div>
    <div class="lay shots" style="padding-top:96px;row-gap:${isDesk(p) ? 64 : 56}px">${shots}</div>
    <div class="lay" style="padding-top:96px">
      <a class="lnk big" href="#/${nxt.id}" style="grid-column:1 / span 12;justify-self:start">Next: ${nxt.name} →</a>
    </div>
  </article>`;
}

function route() {
  const id = location.hash.replace(/^#\/?/, "");
  const p = PROJECTS.find(x => x.id === id);
  if (p) hover = p.id;
  app.innerHTML = p ? projectView(p) : listView();
  document.title = p ? p.name + " — Gianmarco Antonacci" : "Gianmarco Antonacci — Product designer";
  window.scrollTo(0, 0);
  if (p) document.getElementById("pt").focus({ preventScroll: true });
}

function setHover(id) {
  if (id === hover) return;
  hover = id;
  const prev = document.getElementById("prev");
  if (!prev) return;
  prev.innerHTML = preview();
  document.querySelectorAll(".proj").forEach(a => a.classList.toggle("on", a.dataset.id === id));
}

app.addEventListener("mouseover", e => { const a = e.target.closest(".proj"); if (a) setHover(a.dataset.id); });
app.addEventListener("focusin", e => { const a = e.target.closest(".proj"); if (a) setHover(a.dataset.id); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-home]")) { e.preventDefault(); history.pushState(null, "", location.pathname); route(); }
});
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();

// warm the cache for the hover previews
PROJECTS.forEach(p => { const i = new Image(); i.src = img(p.shots[0][0]); });
</script>
</body>
</html>
